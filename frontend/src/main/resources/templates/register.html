<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Платформа Онлайн Обучения</h1>
            <div class="user-info" th:if="${loggedIn}">
                <div class="user-name" th:text="${username}"></div>
                <div class="user-email" th:text="${email}"></div>
            </div>
        </div>
        <nav>
            <a href="/">Курсы</a>
            <a href="/about">Об авторе</a>
            <a th:if="${!loggedIn}" href="/login">Вход</a>
            <a th:if="${!loggedIn}" href="/register">Регистрация</a>
            <a th:if="${role == 'ADMIN'}" href="/admin/users">Управление пользователями</a>
            <a th:if="${loggedIn}" href="/logout">Выход</a>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h2>Регистрация</h2>
            
            <div th:if="${error}" class="error">
                <p th:text="${error}"></p>
            </div>
            
            <div th:if="${success}" class="success">
                <p th:text="${success}"></p>
            </div>
            
            <form method="post" action="/register">
                <div class="form-group">
                    <label for="username">Имя пользователя:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Зарегистрироваться</button>
            </form>
            
            <p style="text-align: center; margin-top: 1rem;">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Платформа Онлайн Обучения</p>
    </footer>
</body>
</html>
