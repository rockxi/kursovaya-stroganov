<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование пользователя</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Платформа Онлайн Обучения</h1>
            <div class="user-info" th:if="${loggedIn}">
                <div class="user-name" th:text="${username}"></div>
                <div class="user-email" th:text="${email}"></div>
            </div>
        </div>
        <nav>
            <a href="/">Курсы</a>
            <a href="/about">Об авторе</a>
            <a th:if="${role == 'ADMIN'}" href="/admin/users">Управление пользователями</a>
            <a th:if="${role == 'ADMIN'}" href="/courses/create">Создать курс</a>
            <a href="/logout">Выход</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Редактирование пользователя</h2>
            
            <div th:if="${error == 'userNotFound'}" class="error">
                <p>Пользователь не найден</p>
            </div>
            
            <div th:if="${error == 'usernameExists'}" class="error">
                <p>Пользователь с таким именем уже существует</p>
            </div>
            
            <div th:if="${error == 'emailExists'}" class="error">
                <p>Пользователь с таким email уже существует</p>
            </div>

            <form method="post" th:action="@{/admin/users/{id}(id=${user.id})}">
                <div class="form-group">
                    <label for="id">ID:</label>
                    <input type="text" id="id" name="id" th:value="${user.id}" readonly>
                </div>
                
                <div class="form-group">
                    <label for="username">Имя пользователя:</label>
                    <input type="text" id="username" name="username" th:value="${user.username}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" th:value="${user.email}" required>
                </div>
                
                <div class="form-group">
                    <label for="role">Роль:</label>
                    <select id="role" name="role">
                        <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <a href="/admin/users" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Платформа Онлайн Обучения</p>
    </footer>
</body>
</html>
